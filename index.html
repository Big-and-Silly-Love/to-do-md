<style>
/* Layout: one phone-width column; sticky list header with overall progress, then task cards that expand into notes and steps. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --fg:#16202B; --muted:#5D6B7A; --line:#DCE2E9;
  --accent:#2952D9; --accent-soft:#E6ECFD; --done:#17885C; --done-soft:#E1F3EA; --over:#B26A00; --over-soft:#FBEFD9; --warn:#C2410C;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", -apple-system, system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --fg:#E7EDF3; --muted:#93A1AF; --line:#2A3542;
  --accent:#7D9BFF; --accent-soft:#1F2A4A; --done:#4CC793; --done-soft:#143327; --over:#F0A93B; --over-soft:#3A2A10; --warn:#FB923C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --fg:#E7EDF3; --muted:#93A1AF; --line:#2A3542;
  --accent:#7D9BFF; --accent-soft:#1F2A4A; --done:#4CC793; --done-soft:#143327; --over:#F0A93B; --over-soft:#3A2A10; --warn:#FB923C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.listpick{flex:1;min-width:0;appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 34px 9px 12px;font-family:var(--display);font-weight:600;font-size:17px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.iconbtn{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;height:42px;padding:0 12px;font-weight:600;font-size:14px}
.iconbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.summary{display:flex;align-items:center;gap:12px}
.ring{flex:none;width:52px;height:52px}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:var(--line)} .ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring.full .val{stroke:var(--done)}
.ring text{font:600 12px var(--body);fill:var(--fg)}
.sumtxt{min-width:0}
.sumtxt b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.sumtxt small{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.status{font-size:12px;color:var(--muted)}
main .wrap{padding-block:14px 40px;display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.done{border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.card.over{border-color:color-mix(in srgb,var(--over) 50%,var(--line))}
.head{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:none;border:0;padding:14px 14px 12px}
.eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;min-width:0}
.count{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-variant-numeric:tabular-nums}
.count b{font-family:var(--display);font-size:22px}
.count span{color:var(--muted);font-size:14px}
.count em{display:block;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.done .count em{color:var(--done)} .over .count em{color:var(--over)} .todo .count em{color:var(--muted)}
.segs{grid-column:1/3;display:flex;gap:3px;margin-top:8px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--accent)} .done .segs i.on{background:var(--done)} .over .segs i.on{background:var(--over)}
.badges{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--muted)}
.badge.req{background:var(--accent-soft);color:var(--accent)}
.badge.earlier{background:var(--over-soft);color:var(--over)}
.body{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:12px}
.meta{display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.meta p{margin:0} .meta b{color:var(--fg);font-weight:600}
.overnote{font-size:13px;background:var(--over-soft);color:var(--over);border-radius:8px;padding:8px 10px}
.donenote{font-size:13px;background:var(--done-soft);color:var(--done);border-radius:8px;padding:8px 10px}
.ckl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ck{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-radius:10px}
.ck:hover{background:var(--bg)}
.ck input{appearance:none;flex:none;width:24px;height:24px;margin:0;border:2px solid var(--line);border-radius:7px;display:grid;place-content:center;background:var(--surface)}
.ck input::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.ck input:checked{background:var(--done);border-color:var(--done)} .ck input:checked::after{opacity:1}
.ck label{flex:1;min-width:0;padding-top:1px;overflow-wrap:anywhere}
.ck.on label{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ck .x{flex:none;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.sect{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 0}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.addrow button{border:0;border-radius:10px;padding:0 14px;background:var(--accent);color:#fff;font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h2{margin:0;font-family:var(--display);color:var(--fg);font-size:20px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 15 20 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-size:21px}
.sheet p{margin:0;color:var(--muted);font-size:13.5px}
.sheet label.f{display:grid;gap:5px;font-size:13px;font-weight:600}
.sheet input[type=text],.sheet textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%}
.sheet textarea{min-height:160px;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.preview{border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;font-size:13px}
.preview table{border-collapse:collapse;width:100%}
.preview td,.preview th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.preview th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.preview td.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11px;color:var(--done);font-weight:600}
.tag.no{color:var(--muted)}
.mgmt{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* To Do additions: a quick-tick circle beside each task, due/priority badges, step counter. */
.head{display:flex;align-items:flex-start;gap:0;padding:0;grid-template-columns:none}
.qk{flex:none;width:30px;height:30px;margin:14px 0 0 14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-content:center;padding:0;color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.qk::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px);display:none}
.done .qk,.over .qk{background:var(--done);border-color:var(--done)} .done .qk::after,.over .qk::after{display:block} .done .qk span,.over .qk span{display:none}
.qk.part{border-color:var(--accent);color:var(--accent)}
.hb{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:none;border:0;padding:14px 14px 12px 12px}
.hb .eyebrow,.hb .title{grid-column:1}
.done .hb .title.one{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.badge.hi{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.badge.late{background:var(--warn);color:#fff}
.badge.soon{background:var(--over-soft);color:var(--over)}
.badge.ok{background:var(--done-soft);color:var(--done)}
.meta a{color:var(--accent);overflow-wrap:anywhere}
.counter{display:flex;align-items:center;gap:12px}
.counter button{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:20px;font-weight:600}
.counter b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
.sectionhdr{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 2px -2px}
.iconbtn.spin{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
</style>

<header class="top">
  <div class="wrap">
    <div class="row"><span class="brand">To Do</span><span class="status" id="status"></span></div>
    <div class="row">
      <select class="listpick" id="listpick" aria-label="List"></select>
      <button class="iconbtn" id="managebtn" aria-label="More options" title="More options">•••</button>
      <button class="iconbtn primary" id="refreshbtn" aria-label="Check for updates" title="Check for updates">↻</button>
    </div>
    <div class="summary" id="summary" hidden>
      <svg class="ring" id="ring" viewBox="0 0 52 52" aria-hidden="true">
        <circle class="trk" cx="26" cy="26" r="22"/><circle class="val" id="ringval" cx="26" cy="26" r="22" transform="rotate(-90 26 26)" stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
        <text x="26" y="30" text-anchor="middle" id="ringpct">0%</text>
      </svg>
      <div class="sumtxt"><b id="sumcount">0 / 0</b><small id="sumsub">tasks done</small></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="todo" aria-pressed="false">Still to do</button>
      <button class="chip" data-f="soon" aria-pressed="false">Due soon</button>
      <button class="chip" data-f="hi" aria-pressed="false">High priority</button>
      <button class="chip" data-f="done" aria-pressed="false">Done</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="cards">
  <div class="empty"><h2>Loading your list…</h2><p>Reading todo.md</p></div>
</div></main>

<script>
const SRC = () => (S.data && S.data.source) || 'todo.md';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
const slug = s => norm(s).replace(/ /g, '-').slice(0, 60) || 'x';

/* ---------- minimal .xlsx reader (zip + XML), no libraries ---------- */
async function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('not-xlsx');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const files = {};
  for (let k = 0; k < n && dv.getUint32(p, true) === 0x02014b50; k++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true),
      xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    files[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen)).replace(/^\//, '')] = {method, csize, off};
    p += 46 + nlen + xlen + clen;
  }
  const find = name => files[name] || files[Object.keys(files).find(k => k.toLowerCase() === name.toLowerCase())];
  return async name => {
    const f = find(name); if (!f) return null;
    const s = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(s, s + f.csize); let out;
    if (f.method === 0) out = data;
    else if (f.method === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('old-ios');
      out = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else throw new Error('zip-method');

}
const xml = s => new DOMParser().parseFromString(s, 'application/xml');
const tags = (node, name) => [...node.getElementsByTagNameNS('*', name)];
const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
async function readSheetRows(buf) {
  const get = await readZip(buf);
  const wb = await get('xl/workbook.xml'); if (!wb) throw new Error('not-xlsx');
  const sheets = tags(xml(wb), 'sheet').map(s => ({name: s.getAttribute('name'), rid: s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || s.getAttribute('r:id')}));
  const rels = {}; tags(xml(await get('xl/_rels/workbook.xml.rels') || '<x/>'), 'Relationship').forEach(r => rels[r.getAttribute('Id')] = r.getAttribute('Target'));
  const pick = sheets.find(s => /^tasks?$/i.test(s.name.trim())) || sheets.find(s => /task|to ?do/i.test(s.name)) || sheets[0];
  if (!pick) throw new Error('no-sheet');
  let target = rels[pick.rid] || 'worksheets/sheet1.xml';
  target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
  const shared = []; const ss = await get('xl/sharedStrings.xml');
  if (ss) tags(xml(ss), 'si').forEach(si => shared.push(tags(si, 't').filter(t => !t.closest || !t.parentNode || t.parentNode.localName !== 'rPh').map(t => t.textContent).join('')));
  const doc = xml(await get(target) || '<x/>'); const rows = [];
  tags(doc, 'row').forEach(r => {
    const rn = +r.getAttribute('r') - 1; const row = [];
    tags(r, 'c').forEach((c, i) => {
      const ref = c.getAttribute('r'); const ci = ref ? colIdx(ref) : i; const t = c.getAttribute('t');
      const v = tags(c, 'v')[0]; const vt = v ? v.textContent : '';
      let val;
      if (t === 's') val = shared[+vt] ?? '';
      else if (t === 'inlineStr') val = tags(c, 't').map(x => x.textContent).join('');
      else if (t === 'b') val = vt === '1' ? 'TRUE' : 'FALSE';
      else if (t === 'str' || t === 'e') val = vt;
      else val = vt === '' ? '' : Number(vt);
      row[ci] = val;

    rows[rn >= 0 ? rn : rows.length] = row;

}
function toDate(v) {

  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }

}
function rowsToLists(rows) {
  const hi = rows.findIndex(r => r.some(c => norm(c) === 'task' || norm(c) === 'tasks'));

    pri: col('priority', /^prior/), steps: col('steps', 'sub tasks', 'subtasks', 'checklist', /^steps/), notes: col('notes', 'note', 'details', /^notes/), link: col('link', 'url', 'website', /^link/) };
  const lists = new Map(); let curList = '', curSec = '';
  for (const r of rows.slice(hi + 1)) {
    const g = k => C[k] >= 0 ? r[C[k]] ?? '' : '';
    const txt = k => String(g(k)).trim();
    if (txt('list')) { if (txt('list') !== curList) curSec = ''; curList = txt('list'); }
    if (txt('section')) curSec = txt('section');
    const task = txt('task'); if (!task) continue;
    const listName = curList || 'My list'; const key = slug(listName);
    if (!lists.has(key)) lists.set(key, {id: key, name: listName, lines: [], ids: new Set()});
    const L = lists.get(key);
    let id = slug(curSec) + '~' + slug(task); let k = 2; while (L.ids.has(id)) id = slug(curSec) + '~' + slug(task) + '-' + k++; L.ids.add(id);

      <div class="btns" id="mg-reset-box"><button class="btn" id="mg-reset">Clear ticks…</button></div></div>` : ''}
    <div class="mgmt"><p>Your ticks are saved on this phone only. Back them up now and then, or to move to another phone.</p>
      <div class="btns"><button class="btn" id="mg-backup">Backup &amp; restore…</button></div></div>
    <div class="btns"><button class="btn" id="mg-close">Close</button></div>`);
  $('#mg-close').addEventListener('click', closeSheet);
  $('#mg-backup').addEventListener('click', openBackup);
  $('#mg-refresh').addEventListener('click', () => { closeSheet(); refresh(true); });
  if (!l) return;
  $('#mg-copy').addEventListener('click', () => { const txt = summaryText(l);
    navigator.clipboard.writeText(txt).then(() => toast('Summary copied'), () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.minHeight = '120px'; $('#mg-copy').after(ta); ta.select(); toast('Select and copy the text'); }); });
  $('#mg-reset').addEventListener('click', () => { $('#mg-reset-box').innerHTML = `<button class="btn danger" id="mg-reset-yes">Yes, clear all ticks</button><button class="btn" id="mg-reset-no">Keep them</button>`;
    $('#mg-reset-no').addEventListener('click', closeSheet);
    $('#mg-reset-yes').addEventListener('click', () => { S.progress[l.id] = {}; const d = Local.read(); d.progress = S.progress; Local.write(d); closeSheet(); render(); toast('Ticks cleared'); }); });
}
function lastBackupNote() { let ts = null; try { ts = localStorage.getItem('todo.backupAt'); } catch (e) {} return ts ? 'Last backup ' + ago(ts) : 'No backup yet'; }
function markBackup() { try { localStorage.setItem('todo.backupAt', new Date().toISOString()); } catch (e) {} }
function backupText() { return JSON.stringify({app: 'to-do', version: 1, savedAt: new Date().toISOString(), progress: S.progress}); }
function openBackup() {
  sheet(`<h2>Backup &amp; restore</h2>
    <p>A backup holds every tick and every step you added. Your tasks themselves are in ${esc(SRC())}. ${esc(lastBackupNote())}.</p>
    <div class="btns"><button class="btn primary" id="bk-file">Save backup file</button><button class="btn" id="bk-copy">Copy backup text</button></div>
    <div class="mgmt"><p>Restore replaces all ticks in the app with the backup. Choose a backup file, or paste backup text.</p>
      <label class="f" for="bk-pick">Backup file<input type="file" id="bk-pick" accept=".json,application/json,text/plain"></label>
      <label class="f" for="bk-text">Or paste backup text<textarea id="bk-text" style="min-height:90px"></textarea></label>
      <div class="btns" id="bk-restore-box"><button class="btn" id="bk-restore" disabled>Restore…</button></div></div>
    <div class="btns"><button class="btn" id="bk-close">Close</button></div>`);
  $('#bk-close').addEventListener('click', closeSheet);
  $('#bk-file').addEventListener('click', async () => {
    const txt = backupText(); const name = 'to-do-backup-' + today() + '.json';
    try { const file = new File([txt], name, {type: 'application/json'});
      if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); markBackup(); toast('Backup ready'); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'application/json'})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); markBackup(); toast('Backup saved');
  });
  $('#bk-copy').addEventListener('click', () => { const txt = backupText();
    navigator.clipboard.writeText(txt).then(() => { markBackup(); toast('Backup copied - paste it into Notes'); },
      () => { const ta = $('#bk-text'); ta.value = txt; ta.select(); toast('Select the text below and copy it'); }); });
  let pending = null;
  const check = txt => { pending = null; try { const o = JSON.parse(txt); if (o && o.app === 'to-do' && o.progress) pending = o; } catch (e) {}
    $('#bk-restore').disabled = !pending; $('#bk-restore').textContent = pending ? `Restore ticks from ${new Date(pending.savedAt).toLocaleDateString('en-AU')}…` : 'Restore…'; };
  $('#bk-text').addEventListener('input', e => check(e.target.value));
  $('#bk-pick').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { check(txt); if (!pending) toast("That file isn't a To Do backup"); }); });
  $('#bk-restore').addEventListener('click', () => {
    $('#bk-restore-box').innerHTML = `<button class="btn danger" id="bk-yes">Replace all ticks with the backup</button><button class="btn" id="bk-no">Cancel</button>`;
    $('#bk-no').addEventListener('click', closeSheet);
    $('#bk-yes').addEventListener('click', () => { S.progress = pending.progress; const d = Local.read(); d.progress = S.progress; Local.write(d); closeSheet(); render(); toast('Ticks restored'); });
  });
}

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
refresh(false);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (!S.data || Date.now() - Date.parse(S.data.fetchedAt) > 60000)) refresh(false); else if (document.visibilityState === 'visible') render(); });
setInterval(statusLine, 60000);
</script>
